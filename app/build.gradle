plugins {
    id 'com.android.application'
}

android {
    namespace 'com.goalhole.studio'
    compileSdk 35

    defaultConfig {
        applicationId 'com.goalhole.studio'
        minSdk 26
        targetSdk 35
        versionCode 7
        versionName '6.1-android'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }
}
