name: Tarif Pro APK
on:
  workflow_dispatch:
  push:
    branches: [main, 'claude/android-recipe-app-04jnvh']
    paths:
      - 'TarifPro/**'
      - '.github/workflows/tarifpro-apk.yml'

permissions:
  contents: write

concurrency:
  group: tarifpro-${{ github.ref }}
  cancel-in-progress: true

env:
  VERSION: 1.0.${{ github.run_number }}

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: TarifPro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Birim testleri ve APK derleme
        env:
          FIREBASE_API_KEY: ${{ secrets.FIREBASE_API_KEY }}
          FIREBASE_APP_ID: ${{ secrets.FIREBASE_APP_ID }}
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          GOOGLE_WEB_CLIENT_ID: ${{ secrets.GOOGLE_WEB_CLIENT_ID }}
          ADMIN_EMAILS: ${{ secrets.ADMIN_EMAILS }}
        run: gradle --no-daemon --continue testDebugUnitTest assembleRelease assembleDebug assembleDebugAndroidTest
      - name: APK'ları topla
        run: |
          mkdir -p ../apks
          cp app/build/outputs/apk/release/app-release.apk ../apks/release.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../apks/app-debug.apk
          cp app/build/outputs/apk/androidTest/debug/app-debug-androidTest.apk ../apks/app-debug-androidTest.apk
          cp app/build/outputs/apk/release/app-release.apk "../apks/TarifPro-v${VERSION}.apk"
          ls -la ../apks
      - uses: actions/upload-artifact@v4
        with:
          name: TarifPro-apks
          path: apks/
      - name: GitHub Release yayınla
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tarifpro-v${{ env.VERSION }}
          name: Tarif Pro v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          make_latest: true
          files: apks/TarifPro-v${{ env.VERSION }}.apk
          body: |
            ## 🍽️ Tarif Pro – Android APK
            **İndir:** `TarifPro-v${{ env.VERSION }}.apk` dosyasını telefonunuza indirip açın (bilinmeyen kaynaklardan yüklemeye izin verin).

            - Android 8.0 (API 26) ve üzeri
            - Misafir modunda internet olmadan tüm özellikler çalışır
            - Google ile giriş ve bulut senkronizasyonu için uygulamadaki *Ayarlar › Bulut & Google girişi* adımlarını izleyin (README'de ayrıntılı anlatım var)
            - İmzalama anahtarı SHA-1: `16:E4:47:6E:D7:3B:AC:4E:E7:EC:24:9C:AF:08:21:D0:73:DD:7B:68`

            Emülatör testinden alınan ekran görüntüleri birkaç dakika içinde `ekran-goruntuleri.zip` olarak bu sürüme eklenir.

  emulator-test:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: TarifPro-apks
          path: apks
      - name: KVM'yi etkinleştir
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Emülatörde test et
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          ram-size: 4096M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash TarifPro/ci/emulator-test.sh
      - name: Ekran görüntülerini paketle
        if: always()
        run: |
          cd ci-out && zip -r ../ekran-goruntuleri.zip . && cd ..
          ls -la ci-out ci-out/screens || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: TarifPro-emulator-test
          path: ci-out/
      - name: Sürüme ekle
        if: always()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: tarifpro-v${{ env.VERSION }}
          files: ekran-goruntuleri.zip
      - name: Sonucu kontrol et
        run: |
          test "$(cat ci-out/result.txt)" = "0"
