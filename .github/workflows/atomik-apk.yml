name: Atomik Alışkanlık Koçu APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'atomik-aliskanlik-kocu/**'
      - '.github/workflows/atomik-apk.yml'
jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: atomik-aliskanlik-kocu
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Birim testleri
        run: ./gradlew --no-daemon testDebugUnitTest --tests 'com.atomik.kocu.DomainTest'
      - name: APK derle
        run: ./gradlew --no-daemon assembleDebug
      - run: cp app/build/outputs/apk/debug/app-debug.apk Atomik-Aliskanlik-Kocu-v1.0.apk
      - uses: actions/upload-artifact@v4
        with:
          name: Atomik-Aliskanlik-Kocu-APK
          path: atomik-aliskanlik-kocu/Atomik-Aliskanlik-Kocu-v1.0.apk
